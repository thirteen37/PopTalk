# mlx_lm.lora config for the Poptalk E2B fine-tune (#21). From the repo root:
#   uv run --project training mlx_lm.lora --config training/lora-v5.yaml
model: mlx-community/gemma-4-e2b-it-4bit
train: true
data: training/out/data
adapter_path: training/out/adapters-v5   # v5: v4 + d-imperative and e-insert-imperative; seed 22 run -> adapters-v5-s22
fine_tune_type: lora
mask_prompt: true          # loss on the assistant turn only
num_layers: 16             # last 16 of 35 layers: halves backward cost vs all layers
batch_size: 1
grad_accumulation_steps: 4   # effective batch 4; batch 4 pushed a shared 24 GB Mac into swap (262k-vocab logits)
iters: 3344                # micro-batches = 836 optimizer steps, ~40% of v5's 8,363 train rows (v4: 3,244 of 8,114)
learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 10
  arguments: [1.0e-4, 836, 1.0e-6]   # decay over the optimizer steps
steps_per_report: 100
steps_per_eval: 1672
val_batches: 60
save_every: 300
max_seq_length: 3072
grad_checkpoint: true
seed: 21
lora_parameters:
  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj, mlp.gate_proj, mlp.up_proj, mlp.down_proj]
  rank: 16
  scale: 2.0
  dropout: 0.0
