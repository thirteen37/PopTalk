# mlx_lm.lora config for the Poptalk E2B fine-tune (#21). From the repo root:
#   uv run --project training mlx_lm.lora --config training/lora.yaml
model: mlx-community/gemma-4-e2b-it-4bit
train: true
data: training/out/data
adapter_path: training/out/adapters-v2   # v1 kept in training/out/adapters
fine_tune_type: lora
mask_prompt: true          # loss on the assistant turn only
num_layers: 16             # last 16 of 35 layers: halves backward cost vs all layers
batch_size: 1
grad_accumulation_steps: 4   # effective batch 4; batch 4 pushed a shared 24 GB Mac into swap (262k-vocab logits)
iters: 1200                # micro-batches = 300 optimizer steps (~1,200 examples); v1 ran 150 steps on a shared Mac (~7 s/example)
learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 10
  arguments: [1.0e-4, 300, 1.0e-6]
steps_per_report: 100
steps_per_eval: 600
val_batches: 60
save_every: 300
max_seq_length: 3072
grad_checkpoint: true
seed: 21
lora_parameters:
  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj, mlp.gate_proj, mlp.up_proj, mlp.down_proj]
  rank: 16
  scale: 2.0
  dropout: 0.0
