# mlx_lm.lora config for the E2B v8 adapter (#96): lora-v7.yaml's recipe and seed on v7's data plus the cleanup-level
# rows (<style cleanup="verbatim|polished"/>; gen.py cleanup-level section). Clean rows are v7's, byte for byte.
#   0. swift build -c release; training/make_data_v8.zsh   E4B teacher ~15 min (GPU); syncs iters below to 40% of an epoch
#   1. uv run --project training mlx_lm.lora --config training/lora-v8.yaml   ~85 min, holds the GPU
#   2. mkdir -p adapters/gemma-4-e2b-poptalk-v8
#      cp training/out/adapters-v8/{adapter_config.json,adapters.safetensors} adapters/gemma-4-e2b-poptalk-v8/
#      Loads unfused, like v7; never fuse into the 4-bit base (#103). Weights stay untracked.
#   3. Gate against v7, back to back on one build: training/bench.zsh for v7, then for v8 with --levels (l-* cases),
#      PoptalkBench --compare, scripts/replay.zsh. Ship bar: untagged d, e, s, h within ~2 cases of v7, both guards on
#      and model only; l-* passing at each level; replay raw fallbacks <= v7's in the same session. Then add the
#      adapter to ModelSettings.levelModels.
model: mlx-community/gemma-4-e2b-it-4bit
train: true
data: training/out/v8/data
adapter_path: training/out/adapters-v8
fine_tune_type: lora
mask_prompt: true          # loss on the assistant turn only
num_layers: 16             # last 16 of 35 layers: halves backward cost vs all layers
batch_size: 1
grad_accumulation_steps: 4   # effective batch 4; batch 4 pushed a shared 24 GB Mac into swap (262k-vocab logits)
iters: 7092                # micro-batches, ~40% of an epoch (make_data_v8.zsh syncs this and the two below)
learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 10
  arguments: [1.0e-4, 1773, 1.0e-6]   # decay over the optimizer steps
steps_per_report: 100
steps_per_eval: 3546
val_batches: 60
save_every: 300
max_seq_length: 3072       # longest v6 row ~9,300 characters, about 2,300 tokens
grad_checkpoint: true
seed: 61
lora_parameters:
  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj, mlp.gate_proj, mlp.up_proj, mlp.down_proj]
  rank: 16
  scale: 2.0
  dropout: 0.0
