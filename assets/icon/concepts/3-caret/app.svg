<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Poptalk concept 3 "caret": a waveform flowing into a text I-beam. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3A78"/>
      <stop offset="1" stop-color="#10163D"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bars" gradientUnits="userSpaceOnUse" x1="247" y1="0" x2="560" y2="0">
      <stop offset="0" stop-color="#6CF0FF"/>
      <stop offset="1" stop-color="#5B7CFF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <filter id="glow" x="-50%" y="-20%" width="200%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#7FA0FF" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <g fill="url(#bars)">
    <rect x="247" y="422" width="46" height="180" rx="23"/>
    <rect x="327" y="352" width="46" height="320" rx="23"/>
    <rect x="407" y="397" width="46" height="230" rx="23"/>
    <rect x="487" y="452" width="46" height="120" rx="23"/>
  </g>
  <path filter="url(#glow)" fill="none" stroke="#fff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"
        d="M612 262 H768 M612 762 H768 M690 262 V762"/>
</svg>
