<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- PopTalk concept 4 "select": a waveform over a text-selection highlight. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7B5CF0"/>
      <stop offset="1" stop-color="#3B2394"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD766"/>
      <stop offset="1" stop-color="#FFB938"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E0F5C" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <g filter="url(#lift)">
    <rect x="428" y="327" width="310" height="370" rx="36" fill="url(#hl)"/>
    <!-- selection handles -->
    <g fill="#fff">
      <rect x="420" y="300" width="16" height="397" rx="8"/>
      <circle cx="428" cy="296" r="30"/>
      <rect x="730" y="327" width="16" height="397" rx="8"/>
      <circle cx="738" cy="728" r="30"/>
    </g>
  </g>
  <g fill="#fff">
    <rect x="286" y="432" width="44" height="160" rx="22"/>
    <rect x="346" y="392" width="44" height="240" rx="22"/>
  </g>
  <g fill="#3B2394">
    <rect x="462" y="352" width="44" height="320" rx="22"/>
    <rect x="528" y="402" width="44" height="220" rx="22"/>
    <rect x="594" y="372" width="44" height="280" rx="22"/>
    <rect x="660" y="442" width="44" height="140" rx="22"/>
  </g>
</svg>
